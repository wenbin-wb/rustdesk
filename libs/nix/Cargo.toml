# Vendored for the HarmonyOS port. The stock default set turns on modules that assume
# target_os = "linux" means glibc: aio (aio_read/...), mqueue (mq_open/...), fs
# (__fsword_t, ST_RELATIME, XFS_SUPER_MAGIC), personality (FDPIC_FUNCPTRS, UNAME26) and
# signal (SigevNotify::SigevThreadId) do not exist in HarmonyOS' musl-shaped libc, and
# nix therefore cannot be compiled for aarch64-unknown-linux-ohos at all.
#
# The only consumer in our graph is webrtc-util's `ifaces`, which needs nothing beyond
# getifaddrs and the sockaddr decoding helpers, both behind the `net` feature. Trimming
# the default set drops the glibc-only modules without touching a line of nix's source.
# Re-widen this if a future dependency needs more of nix on a glibc target.
default = [
    "net",
]
dir = ["fs"]
env = []
event = []
feature = []
fs = []
hostname = []
inotify = []
ioctl = []
kmod = []
mman = []
mount = ["uio"]
mqueue = ["fs"]
net = ["socket"]
personality = []
poll = []
process = []
pthread = []
ptrace = ["process"]
quota = []
reboot = []
resource = []
sched = ["process"]
signal = ["process"]
socket = ["memoffset"]
term = []
time = []
ucontext = ["signal"]
uio = []
user = ["feature"]
zerocopy = [
    "fs",
    "uio",
]

[target."cfg(any(target_os = \"android\", target_os = \"linux\"))".dev-dependencies.caps]
version = "0.5.3"

[target."cfg(not(target_os = \"redox\"))".dependencies.memoffset]
version = "0.7"
optional = true

[target."cfg(target_os = \"freebsd\")".dev-dependencies.sysctl]
