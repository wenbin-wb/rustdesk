[package]
name = "rustdesk-ohos-bridge"
version = "1.5.0"
edition = "2021"
publish = false
description = "Node-API bridge exposing the RustDesk core to ArkTS on HarmonyOS"

[lib]
# HarmonyOS loads this as librustdesk_ohos.so, so the crate name is what the ArkTS side
# imports. Keep it independent of the core crate's own cdylib name.
name = "rustdesk_ohos"
crate-type = ["cdylib"]

[dependencies]
# The core, linked in as an rlib. `flutter` is what enables the crate's flutter_ffi
# module (it supplies flutter_rust_bridge's types); HarmonyOS takes that module's
# exports but not its codegen, see src/lib.rs in this crate.
rustdesk = { path = "../../../", features = ["flutter"] }

# napi-ohos / napi-derive-ohos are the OpenHarmony fork of napi-rs (see
# flutter/ohos/PLAN.md section 7.3). HarmonyOS has no Dart isolate, so the core is
# reached through these N-API exports rather than flutter_rust_bridge's codegen.
napi-ohos = { version = "1", default-features = false, features = ["napi8"] }
napi-derive-ohos = "1"

# The core identifies a session by uuid::Uuid (hbb_common's `pub type SessionID`). ArkTS
# has no such type, so the bridge takes the canonical UUID string and parses it. Pinned to
# the same major the workspace uses so the type unifies rather than duplicating.
uuid = { version = "1", features = ["v4"] }

# The surface renderer keeps one global render target and one running flag; the core meanwhile
# logs through log. Both are already in the workspace graph, so this adds no new resolution.
lazy_static = "1"
log = "0.4"

# Reading the display size out of the core's JSON reply. Already resolved at the workspace
# version, so this pins rather than introduces a dependency.
serde_json = "1.0"

[build-dependencies]
napi-build-ohos = "1"
