[package]
name = "rustdesk-ohos-bridge"
version = "1.5.0"
edition = "2021"
publish = false
description = "Node-API bridge exposing the RustDesk core to ArkTS on HarmonyOS"

[lib]
# HarmonyOS loads this as librustdesk_ohos.so, so the crate name is what the ArkTS side
# imports. Keep it independent of the core crate's own cdylib name.
name = "rustdesk_ohos"
crate-type = ["cdylib"]

[dependencies]
# napi-ohos / napi-derive-ohos are the OpenHarmony fork of napi-rs (see
# flutter/ohos/PLAN.md section 7.3). HarmonyOS has no Dart isolate, so the core is
# reached through these N-API exports rather than flutter_rust_bridge's codegen.
napi-ohos = { version = "1", default-features = false, features = ["napi8"] }
napi-derive-ohos = "1"

[build-dependencies]
napi-build-ohos = "1"

# Built standalone: the parent workspace would otherwise try to resolve this crate's
# ohos-only dependencies for the host.
[workspace]
