[target.x86_64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.i686-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-args=/NODEFAULTLIB:MSVCRT"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-Ctarget-feature=+crt-static"]
[target.'cfg(target_os="macos")']
rustflags = [
    "-C", "link-args=-sectcreate __CGPreLoginApp __cgpreloginapp /dev/null",
]
#[target.'cfg(target_os="linux")']
# glibc-static required, this may fix https://github.com/rustdesk/rustdesk/issues/9103, but I do not want this big change
# this is unlikely to help also, because the other so files still use libc dynamically
#rustflags = [
#    "-C", "link-args=-Wl,-Bstatic -lc -Wl,-Bdynamic"
#]
[net]
git-fetch-with-cli = true

# Fast crates.io mirror (China) for dependency downloads
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

# Paths go through the space-free junction C:\ohos-ndk -> DevEco OHOS native dir,
# because CFLAGS/link-args cannot carry a sysroot path containing spaces.
[target.aarch64-unknown-linux-ohos]
linker = "C:/ohos-ndk/llvm/bin/clang.exe"
ar = "C:/ohos-ndk/llvm/bin/llvm-ar.exe"
rustflags = [
    "-C", "link-arg=--target=aarch64-linux-ohos",
    "-C", "link-arg=--sysroot=C:/ohos-ndk/sysroot",
    "-C", "link-arg=-D__MUSL__",
    # The workspace sets rpath = true in [profile.release], which stamps a build-machine
    # path into the shipped module's RUNPATH:
    #   $ORIGIN/..\..\..\..\..\..\.rustup\toolchains\stable-x86_64-pc-windows-gnu\lib\...
    # That directory cannot exist on a device and leaks the build host's layout into the
    # artifact, so turn it off for this target.
    "-C", "rpath=no",
    # Link the libsodium cross-built for this target by
    # flutter/ohos/build_libsodium_ohos.ps1.
    #
    # This is done with rustflags rather than SODIUM_LIB_DIR on purpose. libsodium-sys picks
    # its archive by testing cfg!(windows), which is evaluated when its build script is
    # COMPILED -- that is, against the HOST. On a Windows host it therefore always takes the
    # bundled mingw/win64 branch, whatever the target is, so the target needs an explicit
    # input. Setting SODIUM_LIB_DIR cannot substitute, because the variable is global: it
    # would redirect the host build too, and the host needs its mingw archive because
    # build.rs calls hbb_common::gen_version() and hbb_common depends on sodiumoxide.
    #
    # The archive is named by full path, not via -lsodium, so it cannot lose a search-order
    # race with the unusable mingw archive: lld reports that archive's x86 members as
    # "neither ET_REL nor LLVM bitcode", skips them, and resolves the symbols from here.
    "-C", "link-arg=C:/ohos-libs/prefix-sodium/lib/libsodium.a",
]

# To build for the DevEco emulator instead of a device, add the same block for
# x86_64-unknown-linux-ohos with --target=x86_64-linux-ohos (the emulator images are
# x86_64; see hw.cpu.arch in
# ~/AppData/Local/Huawei/Emulator/deployed/<device>/config.ini). It is not enabled here
# because it is unverified: bindgen needs its own per-target clang arguments in addition
# to this linker block, and neither is currently exercised by the build script.

